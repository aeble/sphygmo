[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphygmo"
version = "0.1.0"
description = "Bridge between BLE blood pressure monitors and health data sinks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["bleak>=1.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sphygmo = "sphygmo.cli:main"
