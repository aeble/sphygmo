name: My device works
description: Confirm that a supported monitor works for you
title: "Works: <brand> <model>"
labels: ["device", "confirmed"]
body:
  - type: input
    id: model
    attributes:
      label: Brand and model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware / hardware version
      description: Shown by sphygmo probe under Device Information
  - type: input
    id: platform
    attributes:
      label: Receiver
      placeholder: "macOS 27, Raspberry Pi OS, ..."
  - type: checkboxes
    id: tested
    attributes:
      label: Tested
      options:
        - label: Pairing
        - label: Live reading
        - label: Buffered readings delivered later
        - label: Second user slot
  - type: textarea
    id: notes
    attributes:
      label: Notes
