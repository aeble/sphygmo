# Runs the tests on Linux, Windows and macOS for every pushed branch.
# The runners have no Bluetooth: this checks installation, parsing, files and paths, not BLE.
name: test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .[test]
      - name: Test
        run: python -m pytest -q
      - name: CLI starts
        run: |
          sphygmo --help
          sphygmo probe --help
